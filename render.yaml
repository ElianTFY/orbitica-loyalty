databases:
  - name: orbitica-loyalty-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: orbitica
    user: orbitica
    storageAutoscalingEnabled: true

services:
  - type: web
    name: orbitica-loyalty-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 60 --access-logfile -
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orbitica-loyalty-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: "8"
      - key: JWT_ISSUER
        value: orbitica-loyalty
      - key: JWT_AUDIENCE
        value: orbitica-loyalty-web
      - key: BFF_SHARED_SECRET
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: LOGIN_MAX_FAILURES
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: SEED_DEMO
        value: "true"
      - key: BOOTSTRAP_SUPERADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_SUPERADMIN_PASSWORD
        sync: false
      - key: DEMO_OWNER_EMAIL
        sync: false
      - key: DEMO_OWNER_PASSWORD
        sync: false
